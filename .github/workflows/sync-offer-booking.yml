name: Sync offer price into booking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync discounted price
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text()
          old = "state.price = cat.tiers[tierIdx].price;"
          new = "state.price = discountedPrice(cat.tiers[tierIdx].price, tierIdx);"
          if old in s and new not in s:
              p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/sync-offer-booking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/sync-offer-booking.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync discounted offer price in booking flow"
          git push
